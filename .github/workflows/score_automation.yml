name: Auto Generate Cricket Scorecards

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর অটোমেটিকভাবে চলবে
    - cron: '*/5 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য option

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scorecard Generator
      run: python generate_scorecard.py

    - name: Commit and Push Image Outputs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # output ফোল্ডার নিশ্চিত করবে এবং খালি থাকলে .gitkeep ফাইল যুক্ত করবে
        mkdir -p output
        touch output/.gitkeep
        
        git add output/
        
        # কোনো পরিবর্তন থাকলে তবেই কমিট করবে, না থাকলে স্কিপ করবে
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto update match scorecards"
          git push
        fi
